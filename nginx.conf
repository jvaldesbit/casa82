# Sitio estático. La imagen base es nginx-unprivileged, que escucha en 8080
# porque el contenedor no corre como root y no puede abrir el 80.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip: el HTML y el CSS bajan bastante. Las fotos ya vienen en WebP, no
    # tiene sentido comprimirlas otra vez.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Astro pone un hash en el nombre de los archivos de _astro/, así que se
    # pueden cachear para siempre.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Las fotos no llevan hash: una semana y revalidación.
    location /fotos/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # La miniatura de WhatsApp se cachea en los servidores de Meta; corta para
    # poder cambiarla sin esperar.
    location = /og.jpg {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
